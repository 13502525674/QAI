<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Head -->
  <circle cx="100" cy="100" r="70" fill="#F3D4B2"/>
  
  <!-- Hair -->
  <path d="M 40 80 Q 20 40 70 30 C 100 10 130 10 160 30 Q 200 40 180 80 L 170 120 Q 160 140 140 130 L 60 130 Q 40 140 30 120 Z" fill="#FFFFFF"/>
  <path d="M 100 20 Q 80 10 60 30" stroke="#CCCCCC" stroke-width="4" fill="none"/>
  <path d="M 100 20 Q 120 10 140 30" stroke="#CCCCCC" stroke-width="4" fill="none"/>

  <!-- Eyes -->
  <circle cx="80" cy="90" r="8" fill="#FFFFFF"/>
  <circle cx="120" cy="90" r="8" fill="#FFFFFF"/>
  <circle cx="80" cy="90" r="4" fill="#333333"/>
  <circle cx="120" cy="90" r="4" fill="#333333"/>
  
  <!-- Eyebrows -->
  <path d="M 70 75 Q 80 70 90 75" stroke="#333333" stroke-width="4" fill="none"/>
  <path d="M 110 75 Q 120 70 130 75" stroke="#333333" stroke-width="4" fill="none"/>
  
  <!-- Nose -->
  <path d="M 100 95 C 95 110 105 110 100 95" fill="#E0B89A"/>
  
  <!-- Mouth -->
  <path d="M 85 120 Q 100 130 115 120" stroke="#333333" stroke-width="3" fill="none"/>
  
  <!-- Thumbs up -->
  <g transform="translate(130, 120) rotate(20)">
    <path d="M 0 0 C -10 -20 -30 -10 -20 10 L -15 30 C -10 40 10 40 15 30 L 10 10 C 20 -10 10 -20 0 0 Z" fill="#F3D4B2"/>
    <path d="M -20 10 C -30 0 -40 10 -30 20 C -20 30 -10 20 -20 10 Z" fill="#F3D4B2"/>
    <path d="M -30 20 Q -35 25 -30 30" stroke="#333333" stroke-width="2" fill="none"/>
  </g>
</svg>